<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head><body>
<header><b>密码保险箱</b><span id="state"></span></header>
<section id="unlockView" hidden>
  <input id="master" type="password" placeholder="主密码" autocomplete="off">
  <button id="unlockBtn">解锁</button>
  <p class="muted">会话 30 分钟后自动锁定；令牌只保存在浏览器内存中。</p>
</section>
<section id="mainView" hidden>
  <div class="row"><input id="q" placeholder="搜索条目"><button id="lockBtn" class="sec">锁定</button></div>
  <h4 id="siteTitle">当前网站</h4><ul id="siteList"></ul>
  <h4>搜索结果</h4><ul id="searchList"></ul>
  <div class="row"><button id="genBtn" class="sec">生成强密码并填入当前页</button></div>
  <p id="genOut" class="muted"></p>
</section>
<p id="msg" class="err"></p>
<footer><a href="options.html" target="_blank">设置</a></footer>
<script src="popup.js"></script></body></html>
